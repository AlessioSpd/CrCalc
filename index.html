<div id="app-root"></div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

#app-root{
  --ink:#15110c;
  --panel:#211a12;
  --panel2:#2b2115;
  --field:#332818;
  --border:#4a3c26;
  --border-lt:#5f4e30;
  --text:#ece1c6;
  --text-muted:#a99873;
  --gold:#d3a24a;
  --gold-dk:#8a6526;
  --sage:#7ba086;
  --sage-dk:#3f5a48;
  --bad:#c06b52;
  --good:#8fae63;
  font-family:'Crimson Pro',serif;
  color:var(--text);
  background:var(--ink);
  padding:20px 16px 40px;
  border-radius:14px;
  line-height:1.5;
}
#app-root *{box-sizing:border-box;}
#app-root h1{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:.03em;
  margin:0 0 4px;
  color:var(--gold);
}
#app-root .subtitle{
  font-size:14px;
  color:var(--text-muted);
  margin:0 0 20px;
  max-width:640px;
}
#app-root .panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:16px;
}
#app-root .panel-title{
  font-family:'Cinzel',serif;
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--sage);
  margin:0 0 10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
#app-root .weights-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px 20px;
}
#app-root .weight-row{display:flex;flex-direction:column;gap:4px;}
#app-root .weight-row label{font-size:12.5px;color:var(--text-muted);display:flex;justify-content:space-between;}
#app-root .weight-row output{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:12px;}
#app-root input[type=range]{
  -webkit-appearance:none;
  height:4px;
  background:var(--border-lt);
  border-radius:2px;
  outline:none;
}
#app-root input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:1px solid var(--gold-dk);
}
#app-root input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:1px solid var(--gold-dk);
}
#app-root .gp-row{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
#app-root .gp-row label{font-size:12.5px;color:var(--text-muted);}

#app-root .creature{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:14px;
  overflow:hidden;
}
#app-root .creature-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  cursor:pointer;
  background:var(--panel2);
}
#app-root .creature-head input.name{
  font-family:'Cinzel',serif;
  font-size:15px;
  color:var(--text);
  background:transparent;
  border:none;
  border-bottom:1px dashed transparent;
  flex:1;
  min-width:80px;
  padding:2px 0;
}
#app-root .creature-head input.name:focus{outline:none;border-bottom:1px dashed var(--gold);}
#app-root .cr-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink);
  background:var(--sage);
  border-radius:50%;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  border:2px solid var(--sage-dk);
}
#app-root select{
  background:var(--field);
  color:var(--text);
  border:1px solid var(--border-lt);
  border-radius:6px;
  padding:4px 6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
}
#app-root .value-stamp{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:15px;
  color:var(--ink);
  background:var(--gold);
  border:2px solid var(--gold-dk);
  border-radius:8px;
  padding:4px 10px;
  white-space:nowrap;
}
#app-root .remove-btn{
  background:transparent;
  border:1px solid var(--border-lt);
  color:var(--bad);
  border-radius:6px;
  width:28px;height:28px;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  flex-shrink:0;
}
#app-root .chevron{color:var(--text-muted);font-size:12px;flex-shrink:0;transition:transform .15s;}
#app-root .creature.open .chevron{transform:rotate(180deg);}
#app-root .creature-body{padding:14px 16px 16px;display:none;}
#app-root .creature.open .creature-body{display:block;}

#app-root .summary-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  padding:0 16px 12px;
  font-size:12px;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
}
#app-root .summary-row span b{color:var(--text);}
#app-root .delta-pos{color:var(--good);}
#app-root .delta-neg{color:var(--bad);}

#app-root .field-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:10px 14px;
  margin-bottom:14px;
}
#app-root .field{display:flex;flex-direction:column;gap:3px;}
#app-root .field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
#app-root input[type=number],#app-root input[type=text]{
  background:var(--field);
  border:1px solid var(--border-lt);
  color:var(--text);
  border-radius:6px;
  padding:6px 8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  width:100%;
}
#app-root .section-label{
  font-family:'Cinzel',serif;
  font-size:11.5px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--sage);
  margin:14px 0 8px;
  border-top:1px solid var(--border);
  padding-top:12px;
}
#app-root .section-label:first-of-type{border-top:none;padding-top:0;margin-top:0;}
#app-root .check-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:6px 14px;
  margin-bottom:6px;
}
#app-root .check-item{display:flex;align-items:center;gap:6px;font-size:13px;}
#app-root .check-item input{accent-color:var(--gold);width:15px;height:15px;}
#app-root .slider-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
#app-root .slider-field label{font-size:12.5px;color:var(--text-muted);display:flex;justify-content:space-between;}
#app-root .slider-field output{color:var(--gold);font-family:'IBM Plex Mono',monospace;}

#app-root .breakdown{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  margin-top:12px;
  font-size:12.5px;
  font-family:'IBM Plex Mono',monospace;
  color:var(--text-muted);
}
#app-root .breakdown div{margin-bottom:3px;}
#app-root .breakdown b{color:var(--text);}
#app-root .final-value{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border-lt);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
#app-root .final-value .big{
  font-family:'IBM Plex Mono',monospace;
  font-size:20px;
  font-weight:600;
  color:var(--gold);
}
#app-root .tier-tag{
  font-size:11px;
  color:var(--sage);
  background:rgba(123,160,134,.12);
  border:1px solid var(--sage-dk);
  border-radius:20px;
  padding:2px 10px;
}

#app-root .add-btn{
  width:100%;
  background:var(--panel);
  border:1px dashed var(--border-lt);
  color:var(--text-muted);
  border-radius:10px;
  padding:12px;
  font-family:'Cinzel',serif;
  font-size:13px;
  letter-spacing:.04em;
  cursor:pointer;
  margin-top:4px;
}
#app-root .add-btn:hover{color:var(--gold);border-color:var(--gold-dk);}
#app-root .foot-note{font-size:11.5px;color:var(--text-muted);margin-top:18px;opacity:.85;}
</style>
<script>
(function(){

// Tabella "Monster Statistics by Challenge Rating" (DMG p.274, 2014). Righe contigue per HP e DPR.
var CR_TABLE = [
  {cr:0,     label:"0",   xp:10,    ac:13, hpMin:1,   hpMax:6,   atk:3,  dprMin:0,   dprMax:1},
  {cr:0.125, label:"1/8", xp:25,    ac:13, hpMin:7,   hpMax:35,  atk:3,  dprMin:2,   dprMax:3},
  {cr:0.25,  label:"1/4", xp:50,    ac:13, hpMin:36,  hpMax:49,  atk:3,  dprMin:4,   dprMax:5},
  {cr:0.5,   label:"1/2", xp:100,   ac:13, hpMin:50,  hpMax:70,  atk:3,  dprMin:6,   dprMax:8},
  {cr:1,     label:"1",   xp:200,   ac:13, hpMin:71,  hpMax:85,  atk:3,  dprMin:9,   dprMax:14},
  {cr:2,     label:"2",   xp:450,   ac:13, hpMin:86,  hpMax:100, atk:3,  dprMin:15,  dprMax:20},
  {cr:3,     label:"3",   xp:700,   ac:13, hpMin:101, hpMax:115, atk:4,  dprMin:21,  dprMax:26},
  {cr:4,     label:"4",   xp:1100,  ac:14, hpMin:116, hpMax:130, atk:5,  dprMin:27,  dprMax:32},
  {cr:5,     label:"5",   xp:1800,  ac:15, hpMin:131, hpMax:145, atk:6,  dprMin:33,  dprMax:38},
  {cr:6,     label:"6",   xp:2300,  ac:15, hpMin:146, hpMax:160, atk:6,  dprMin:39,  dprMax:44},
  {cr:7,     label:"7",   xp:2900,  ac:15, hpMin:161, hpMax:175, atk:6,  dprMin:45,  dprMax:50},
  {cr:8,     label:"8",   xp:3900,  ac:16, hpMin:176, hpMax:190, atk:7,  dprMin:51,  dprMax:56},
  {cr:9,     label:"9",   xp:5000,  ac:16, hpMin:191, hpMax:205, atk:7,  dprMin:57,  dprMax:62},
  {cr:10,    label:"10",  xp:5900,  ac:17, hpMin:206, hpMax:220, atk:7,  dprMin:63,  dprMax:68},
  {cr:11,    label:"11",  xp:7200,  ac:17, hpMin:221, hpMax:235, atk:8,  dprMin:69,  dprMax:74},
  {cr:12,    label:"12",  xp:8400,  ac:17, hpMin:236, hpMax:250, atk:8,  dprMin:75,  dprMax:80},
  {cr:13,    label:"13",  xp:10000, ac:18, hpMin:251, hpMax:265, atk:8,  dprMin:81,  dprMax:86},
  {cr:14,    label:"14",  xp:11500, ac:18, hpMin:266, hpMax:280, atk:8,  dprMin:87,  dprMax:92},
  {cr:15,    label:"15",  xp:13000, ac:18, hpMin:281, hpMax:295, atk:8,  dprMin:93,  dprMax:98},
  {cr:16,    label:"16",  xp:15000, ac:18, hpMin:296, hpMax:310, atk:9,  dprMin:99,  dprMax:104},
  {cr:17,    label:"17",  xp:18000, ac:19, hpMin:311, hpMax:325, atk:10, dprMin:105, dprMax:110},
  {cr:18,    label:"18",  xp:20000, ac:19, hpMin:326, hpMax:340, atk:10, dprMin:111, dprMax:116},
  {cr:19,    label:"19",  xp:22000, ac:19, hpMin:341, hpMax:355, atk:10, dprMin:117, dprMax:122},
  {cr:20,    label:"20",  xp:25000, ac:19, hpMin:356, hpMax:400, atk:10, dprMin:123, dprMax:130}
];

function trIndexByHP(hp){
  for(var i=0;i<CR_TABLE.length;i++){ if(hp<=CR_TABLE[i].hpMax) return i; }
  return CR_TABLE.length-1;
}
function trIndexByDPR(dpr){
  for(var i=0;i<CR_TABLE.length;i++){ if(dpr<=CR_TABLE[i].dprMax) return i; }
  return CR_TABLE.length-1;
}
function clampIdx(i){ return Math.max(0,Math.min(CR_TABLE.length-1,i)); }

function defensiveCR(hp,ac){
  var i = trIndexByHP(hp);
  var diff = ac - CR_TABLE[i].ac;
  var shift = Math.round(diff/2);
  return CR_TABLE[clampIdx(i+shift)].cr;
}
function offensiveCR(dpr,atk){
  var i = trIndexByDPR(dpr);
  var diff = atk - CR_TABLE[i].atk;
  var shift = Math.round(diff/2);
  return CR_TABLE[clampIdx(i+shift)].cr;
}
function xpForCR(cr){
  for(var i=0;i<CR_TABLE.length;i++){ if(CR_TABLE[i].cr===cr) return CR_TABLE[i].xp; }
  return CR_TABLE[CR_TABLE.length-1].xp;
}
function crLabel(cr){
  for(var i=0;i<CR_TABLE.length;i++){ if(CR_TABLE[i].cr===cr) return CR_TABLE[i].label; }
  return String(cr);
}

var RESIST_OPTIONS = [
  {value:'none',     label:'Nessuna',                                              mult:1},
  {value:'partial',  label:'Resistenza a 1\u20132 tipi comuni',                    mult:1.15},
  {value:'broad',    label:'Resistenza ampia o immunit\u00E0 singola',             mult:1.35},
  {value:'nonmagic', label:'Resistenza a tutto il non magico',                     mult:1.75},
  {value:'immune',   label:'Immunit\u00E0 ampia / resistenza e immunit\u00E0 combinate', mult:2.2}
];
function resistMultFor(val){
  for(var i=0;i<RESIST_OPTIONS.length;i++){ if(RESIST_OPTIONS[i].value===val) return RESIST_OPTIONS[i].mult; }
  return 1;
}

function round(n,d){ var f=Math.pow(10,d||0); return Math.round(n*f)/f; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

function roundGP(v){
  if(v<50) return Math.round(v/1)*1;
  if(v<500) return Math.round(v/5)*5;
  if(v<5000) return Math.round(v/25)*25;
  return Math.round(v/100)*100;
}

function tierForCR(cr){
  if(cr<=0.5) return "Liv. 1\u20134";
  if(cr<=3) return "Liv. 5\u201310";
  if(cr<=8) return "Liv. 11\u201316";
  return "Liv. 17\u201320";
}

// ---- stato ----
var weights = { potenza:1, mobilita:1, sensi:1, controllo:1, utilita:1, gestibilita:0.5, rarita:0.5, gpPerXp:2 };

var uid = 0;
function newCreature(seed){
  uid++;
  return Object.assign({
    id:uid, name:"Nuova creatura", cr:1, ac:12, hp:20, dpr:8, atk:4,
    speed:30, fly:0, swim:0, burrow:0, climb:0,
    senses:{dark:false,keen:false,blind:false,tremor:false,telepatia:false},
    control:{presa:false,abbattimento:false,veleno:false,paralisi:false,paura:false,distanza:false,restrained:false,swallow:false},
    utility:{cavalcabile:false,trasporto:false,comunicazione:false,abilita:false,unica:false},
    special:{recharge:false,pack:false,regen:false,magicResist:false},
    resist:'none',
    gestibilita:0, rarita:0, open:false
  }, seed||{});
}

var creatures = [];

function computeCreature(c){
  var resistMult = resistMultFor(c.resist);
  var effHP = c.hp * resistMult;
  var realDef = defensiveCR(effHP, c.ac);
  var realOff = offensiveCR(c.dpr, c.atk);
  var realCR = (realDef+realOff)/2;
  var delta = realCR - c.cr;

  var specialBonus = 0;
  if(c.special.recharge) specialBonus += 2;
  if(c.special.pack) specialBonus += 1.5;
  if(c.special.regen) specialBonus += 1.5;
  if(c.special.magicResist) specialBonus += 1.5;
  var potenza = clamp(5 + delta*3 + specialBonus, 0, 10);

  // Priorit\u00E0 di mobilit\u00E0: volo (la pi\u00F9 versatile) > arrampicata/scavo > camminata base > nuoto (quasi mai usato).
  // Il volo satura a 80ft (non 40) ed \u00E8 amplificato se la creatura \u00E8 cavalcabile: un volante da monta vale molto di pi\u00F9.
  var flyBase = Math.min(c.fly/80,1)*5;
  var flyB = c.utility.cavalcabile ? flyBase*1.3 : flyBase;
  var climbB = Math.min(c.climb/30,1)*2.5;
  var burrowB = Math.min(c.burrow/20,1)*2.5;
  var ground = Math.min(c.speed/40,1)*1.5;
  var swimB = Math.min(c.swim/40,1)*1;
  var mobilita = clamp(flyB+climbB+burrowB+ground+swimB, 0, 10);

  var sensiCount = [c.senses.dark,c.senses.keen,c.senses.blind,c.senses.tremor,c.senses.telepatia].filter(Boolean).length;
  var sensi = clamp(sensiCount,0,5);

  var controllo = 0;
  if(c.control.presa) controllo += 1;
  if(c.control.abbattimento) controllo += 1;
  if(c.control.veleno) controllo += 1;
  if(c.control.paralisi) controllo += 1.5;
  if(c.control.paura) controllo += 1;
  if(c.control.distanza) controllo += 1;
  if(c.control.restrained) controllo += 1.5;
  if(c.control.swallow) controllo += 2;
  controllo = clamp(controllo, 0, 10);

  var util = 0;
  if(c.utility.cavalcabile) util+=3;
  if(c.utility.trasporto) util+=2;
  if(c.utility.comunicazione) util+=2;
  if(c.utility.abilita) util+=2;
  if(c.utility.unica) util+=2;
  util = clamp(util,0,10);

  var gestNorm = clamp(5+c.gestibilita,0,10);
  var raritaNorm = clamp(5+c.rarita,0,10);

  var wsum = weights.potenza+weights.mobilita+weights.sensi+weights.controllo+weights.utilita+weights.gestibilita+weights.rarita;
  var composite = (
    potenza*weights.potenza +
    mobilita*weights.mobilita +
    (sensi*2)*weights.sensi +
    controllo*weights.controllo +
    util*weights.utilita +
    gestNorm*weights.gestibilita +
    raritaNorm*weights.rarita
  ) / (wsum||1);

  var baseGP = xpForCR(c.cr) * weights.gpPerXp;
  var value = roundGP(baseGP * (composite/5));

  return {realDef:realDef, realOff:realOff, realCR:realCR, delta:delta, potenza:potenza,
          mobilita:mobilita, sensi:sensi, controllo:controllo, util:util,
          composite:composite, value:value, effHP:effHP, resistMult:resistMult, specialBonus:specialBonus};
}

// ---- render ----
var root = document.getElementById('app-root');

function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}

function render(){
  root.innerHTML = '';

  var header = el('div',{});
  header.appendChild(el('h1',{},[document.createTextNode('Taccuino dell\u2019addestratore')]));
  header.appendChild(el('p',{class:'subtitle'},[document.createTextNode(
    'Valore composito per creature addestrabili: CR reale (metodo DMG) + mobilit\u00E0, sensi, controllo, utilit\u00E0, gestibilit\u00E0 e rarit\u00E0 narrativa. Regola i pesi qui sotto per adattarlo alla tua campagna.'
  )]));
  root.appendChild(header);

  // pannello pesi
  var wPanel = el('div',{class:'panel'});
  var wTitle = el('div',{class:'panel-title'},[document.createTextNode('Pesi del sistema')]);
  wPanel.appendChild(wTitle);
  var wGrid = el('div',{class:'weights-grid'});

  function weightSlider(keyName, label, min, max, step){
    var wrap = el('div',{class:'weight-row'});
    var lab = el('label',{},[document.createTextNode(label)]);
    var out = el('output',{},[document.createTextNode(round(weights[keyName],2))]);
    lab.appendChild(out);
    var input = el('input',{type:'range', min:min, max:max, step:step, value:weights[keyName]});
    input.addEventListener('input', function(){
      weights[keyName] = parseFloat(input.value);
      out.textContent = round(weights[keyName],2);
      renderCreatures();
    });
    wrap.appendChild(lab); wrap.appendChild(input);
    return wrap;
  }

  wGrid.appendChild(weightSlider('potenza','Potenza bruta',0,2,0.1));
  wGrid.appendChild(weightSlider('mobilita','Mobilit\u00E0',0,2,0.1));
  wGrid.appendChild(weightSlider('sensi','Sensi',0,2,0.1));
  wGrid.appendChild(weightSlider('controllo','Controllo',0,2,0.1));
  wGrid.appendChild(weightSlider('utilita','Utilit\u00E0 extra',0,2,0.1));
  wGrid.appendChild(weightSlider('gestibilita','Gestibilit\u00E0',0,2,0.1));
  wGrid.appendChild(weightSlider('rarita','Rarit\u00E0 narrativa',0,2,0.1));
  wPanel.appendChild(wGrid);

  var gpRow = el('div',{class:'gp-row'});
  gpRow.appendChild(el('label',{},[document.createTextNode('Monete per punto XP (calibrazione economica)')]));
  var gpOut = el('output',{style:'color:var(--gold);font-family:\'IBM Plex Mono\',monospace;font-size:12px;'},[document.createTextNode(weights.gpPerXp)]);
  var gpInput = el('input',{type:'range', min:'0.5', max:'6', step:'0.5', value:weights.gpPerXp, style:'flex:1;max-width:220px;'});
  gpInput.addEventListener('input', function(){
    weights.gpPerXp = parseFloat(gpInput.value);
    gpOut.textContent = weights.gpPerXp;
    renderCreatures();
  });
  gpRow.appendChild(gpInput); gpRow.appendChild(gpOut);
  wPanel.appendChild(gpRow);

  root.appendChild(wPanel);

  var listWrap = el('div',{id:'creature-list'});
  root.appendChild(listWrap);
  renderCreatures();

  var addBtn = el('button',{class:'add-btn'},[document.createTextNode('+ aggiungi creatura')]);
  addBtn.addEventListener('click', function(){
    creatures.push(newCreature({open:true}));
    renderCreatures();
  });
  root.appendChild(addBtn);

  root.appendChild(el('p',{class:'foot-note'},[document.createTextNode(
    'CR reale calcolato con il metodo ufficiale del DMG (CR difensivo da PF/CA, CR offensivo da danno/round e bonus di attacco, media dei due). Danno/round va inserito assumendo che i colpi vadano a segno; l\u2019accuratezza entra separatamente col bonus di attacco.'
  )]));
}

function renderCreatures(){
  var listWrap = document.getElementById('creature-list');
  listWrap.innerHTML = '';
  creatures.forEach(function(c){ listWrap.appendChild(renderCreature(c)); });
}

function checkItem(label, obj, key, onChange){
  var item = el('label',{class:'check-item'});
  var input = el('input',{type:'checkbox'});
  input.checked = !!obj[key];
  input.addEventListener('change', function(){ obj[key]=input.checked; onChange(); });
  item.appendChild(input);
  item.appendChild(document.createTextNode(label));
  return item;
}

function numField(label, obj, key, onChange, w){
  var f = el('div',{class:'field', style:w?('flex:0 0 '+w+';'):''});
  f.appendChild(el('label',{},[document.createTextNode(label)]));
  var input = el('input',{type:'number', value:obj[key]});
  input.addEventListener('input', function(){
    var v = parseFloat(input.value);
    obj[key] = isNaN(v)?0:v;
    onChange();
  });
  f.appendChild(input);
  return f;
}

function selectField(label, obj, key, options, onChange){
  var f = el('div',{class:'field'});
  f.appendChild(el('label',{},[document.createTextNode(label)]));
  var select = el('select',{style:'width:100%;'});
  options.forEach(function(opt){
    var o = el('option',{value:opt.value},[document.createTextNode(opt.label)]);
    if(opt.value===obj[key]) o.setAttribute('selected','selected');
    select.appendChild(o);
  });
  select.addEventListener('change', function(){ obj[key]=select.value; onChange(); });
  f.appendChild(select);
  return f;
}

function sliderField(label, obj, key, min, max, onChange){
  var f = el('div',{class:'slider-field'});
  var lab = el('label',{},[document.createTextNode(label)]);
  var out = el('output',{},[document.createTextNode(obj[key]>0?'+'+obj[key]:obj[key])]);
  lab.appendChild(out);
  var input = el('input',{type:'range', min:min, max:max, step:'1', value:obj[key]});
  input.addEventListener('input', function(){
    obj[key] = parseInt(input.value,10);
    out.textContent = obj[key]>0?'+'+obj[key]:obj[key];
    onChange();
  });
  f.appendChild(lab); f.appendChild(input);
  return f;
}

function renderCreature(c){
  var card = el('div',{class:'creature'+(c.open?' open':'')});

  var head = el('div',{class:'creature-head'});
  var chev = el('span',{class:'chevron'},[document.createTextNode('\u25BC')]);
  var badge = el('div',{class:'cr-badge'},[document.createTextNode('CR '+crLabel(c.cr))]);

  var nameInput = el('input',{class:'name', type:'text', value:c.name});
  nameInput.addEventListener('input', function(){ c.name = nameInput.value; });
  nameInput.addEventListener('click', function(e){ e.stopPropagation(); });

  var crSelect = el('select',{});
  CR_TABLE.forEach(function(row){
    var opt = el('option',{value:row.cr},[document.createTextNode('CR '+row.label)]);
    if(row.cr===c.cr) opt.setAttribute('selected','selected');
    crSelect.appendChild(opt);
  });
  crSelect.addEventListener('change', function(e){ e.stopPropagation(); c.cr = parseFloat(crSelect.value); update(); });
  crSelect.addEventListener('click', function(e){ e.stopPropagation(); });

  var result = computeCreature(c);
  var stamp = el('div',{class:'value-stamp'},[document.createTextNode(result.value.toLocaleString('it-IT')+' mo')]);

  var removeBtn = el('button',{class:'remove-btn', title:'Rimuovi'},[document.createTextNode('\u00D7')]);
  removeBtn.addEventListener('click', function(e){
    e.stopPropagation();
    creatures = creatures.filter(function(cc){ return cc.id!==c.id; });
    renderCreatures();
  });

  head.appendChild(chev);
  head.appendChild(badge);
  head.appendChild(nameInput);
  head.appendChild(crSelect);
  head.appendChild(stamp);
  head.appendChild(removeBtn);
  head.addEventListener('click', function(){ c.open = !c.open; renderCreatures(); });
  card.appendChild(head);

  var summary = el('div',{class:'summary-row'});
  var deltaClass = result.delta>=0?'delta-pos':'delta-neg';
  var deltaTxt = (result.delta>=0?'+':'')+round(result.delta,2);
  summary.innerHTML =
    '<span>Potenza <b>'+round(result.potenza,1)+'</b>/10</span>' +
    '<span>Mobilit\u00E0 <b>'+round(result.mobilita,1)+'</b>/10</span>' +
    '<span>Sensi <b>'+result.sensi+'</b>/5</span>' +
    '<span>Controllo <b>'+round(result.controllo,1)+'</b>/10</span>' +
    '<span>Utilit\u00E0 <b>'+result.util+'</b>/10</span>' +
    '<span>Composito <b>'+round(result.composite,2)+'</b>/10</span>' +
    '<span class="tier-tag">'+tierForCR(c.cr)+'</span>';
  card.appendChild(summary);

  var body = el('div',{class:'creature-body'});

  function update(){ renderCreatures(); }

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Statistiche')]));
  var statsGrid = el('div',{class:'field-grid'});
  statsGrid.appendChild(numField('CA', c, 'ac', update));
  statsGrid.appendChild(numField('PF', c, 'hp', update));
  statsGrid.appendChild(numField('Danno/round (se colpisce)', c, 'dpr', update));
  statsGrid.appendChild(numField('Bonus attacco', c, 'atk', update));
  body.appendChild(statsGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Resistenze e immunit\u00E0')]));
  var resistGrid = el('div',{class:'field-grid'});
  resistGrid.appendChild(selectField('Livello (aumenta i PF effettivi ai fini del CR difensivo)', c, 'resist', RESIST_OPTIONS, update));
  body.appendChild(resistGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Movimento')]));
  var moveGrid = el('div',{class:'field-grid'});
  moveGrid.appendChild(numField('Velocit\u00E0', c, 'speed', update));
  moveGrid.appendChild(numField('Volo', c, 'fly', update));
  moveGrid.appendChild(numField('Nuoto', c, 'swim', update));
  moveGrid.appendChild(numField('Scavo', c, 'burrow', update));
  moveGrid.appendChild(numField('Arrampicata', c, 'climb', update));
  body.appendChild(moveGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Sensi')]));
  var sensiGrid = el('div',{class:'check-grid'});
  sensiGrid.appendChild(checkItem('Scurovisione', c.senses, 'dark', update));
  sensiGrid.appendChild(checkItem('Sensi acuti (vantaggio Percezione)', c.senses, 'keen', update));
  sensiGrid.appendChild(checkItem('Vista cieca', c.senses, 'blind', update));
  sensiGrid.appendChild(checkItem('Tremorsenso', c.senses, 'tremor', update));
  sensiGrid.appendChild(checkItem('Telepatia', c.senses, 'telepatia', update));
  body.appendChild(sensiGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Controllo in combattimento')]));
  var ctrlGrid = el('div',{class:'check-grid'});
  ctrlGrid.appendChild(checkItem('Presa/afferrare', c.control, 'presa', update));
  ctrlGrid.appendChild(checkItem('Abbattimento (prono)', c.control, 'abbattimento', update));
  ctrlGrid.appendChild(checkItem('Veleno', c.control, 'veleno', update));
  ctrlGrid.appendChild(checkItem('Paralisi/stordimento', c.control, 'paralisi', update));
  ctrlGrid.appendChild(checkItem('Spavento/paura', c.control, 'paura', update));
  ctrlGrid.appendChild(checkItem('Attacco a distanza', c.control, 'distanza', update));
  ctrlGrid.appendChild(checkItem('Irretire/immobilizzare (restrained)', c.control, 'restrained', update));
  ctrlGrid.appendChild(checkItem('Inghiottire (swallow)', c.control, 'swallow', update));
  body.appendChild(ctrlGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Tratti speciali')]));
  var specialGrid = el('div',{class:'check-grid'});
  specialGrid.appendChild(checkItem('Abilit\u00E0 a ricarica (es. soffio)', c.special, 'recharge', update));
  specialGrid.appendChild(checkItem('Pack tactics (tattica di branco)', c.special, 'pack', update));
  specialGrid.appendChild(checkItem('Rigenerazione', c.special, 'regen', update));
  specialGrid.appendChild(checkItem('Resistenza alle magie (vantaggio sui TS)', c.special, 'magicResist', update));
  body.appendChild(specialGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Utilit\u00E0 fuori dal combattimento')]));
  var utilGrid = el('div',{class:'check-grid'});
  utilGrid.appendChild(checkItem('Cavalcabile', c.utility, 'cavalcabile', update));
  utilGrid.appendChild(checkItem('Trasporto/carico', c.utility, 'trasporto', update));
  utilGrid.appendChild(checkItem('Comunicazione (Int alta/lingue)', c.utility, 'comunicazione', update));
  utilGrid.appendChild(checkItem('Abilit\u00E0 rilevanti (Percez./Furtiv./Atl.)', c.utility, 'abilita', update));
  utilGrid.appendChild(checkItem('Capacit\u00E0 unica (mimetismo, resistenze...)', c.utility, 'unica', update));
  body.appendChild(utilGrid);

  body.appendChild(el('div',{class:'section-label'},[document.createTextNode('Valutazione soggettiva del DM')]));
  body.appendChild(sliderField('Gestibilit\u00E0 (indole/rischio)', c, 'gestibilita', -3, 3, update));
  body.appendChild(sliderField('Rarit\u00E0 narrativa nella tua campagna', c, 'rarita', -3, 3, update));

  var breakdown = el('div',{class:'breakdown'});
  breakdown.innerHTML =
    '<div>PF effettivi ai fini del CR difensivo: <b>'+round(result.effHP,0)+'</b> (PF '+c.hp+' &times; '+result.resistMult+')</div>' +
    '<div>CR difensivo: <b>'+crLabel(result.realDef)+'</b> &middot; CR offensivo: <b>'+crLabel(result.realOff)+'</b> &middot; CR reale: <b>'+round(result.realCR,2)+'</b></div>' +
    '<div>Scarto dal CR nominale ('+crLabel(c.cr)+'): <b class="'+deltaClass+'">'+deltaTxt+'</b>'+(result.specialBonus>0?' &middot; bonus tratti speciali: <b class="delta-pos">+'+round(result.specialBonus,1)+'</b>':'')+'</div>' +
    '<div>XP di base per CR '+crLabel(c.cr)+': <b>'+xpForCR(c.cr).toLocaleString('it-IT')+'</b></div>';
  body.appendChild(breakdown);

  var finalRow = el('div',{class:'final-value'});
  finalRow.appendChild(el('span',{style:'font-size:12px;color:var(--text-muted);'},[document.createTextNode('Valore stimato come ricompensa/oggetto')]));
  finalRow.appendChild(el('span',{class:'big'},[document.createTextNode(result.value.toLocaleString('it-IT')+' mo')]));
  body.appendChild(finalRow);

  card.appendChild(body);
  return card;
}

render();
})();
</script>
